server:
  port: 9000

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # ── Global CORS ──────────────────────────────────────────────────────────
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            # Expose Authorization so clients can read it back (e.g. refresh flows)
            exposedHeaders:
              - Authorization

      # ── Default filters applied to EVERY route ───────────────────────────────
      # PreserveHostHeader: keeps the original Host header.
      # There is NO RemoveRequestHeader for Authorization here — the token must
      # be forwarded as-is to every downstream service so they can validate JWT.
      default-filters:
        - PreserveHostHeader
        - "DeduplicateResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_LAST"

      # ── Routes ───────────────────────────────────────────────────────────────
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:lb://AUTH-SERVICE}
          predicates:
            - Path=/api/v1/auth/**, /auth/**
          filters:
            - RewritePath=/api/v1/auth(?<segment>/?.*), /auth${segment}

        - id: post-service
          uri: ${POST_SERVICE_URL:lb://POST-SERVICE}
          predicates:
            - Path=/api/v1/posts/**, /posts/**
          filters:
            - RewritePath=/api/v1/posts(?<segment>/?.*), /posts${segment}

        - id: comment-service
          uri: ${COMMENT_SERVICE_URL:lb://COMMENT-SERVICE}
          predicates:
            - Path=/api/v1/comments/**, /comments/**
          filters:
            - RewritePath=/api/v1/comments(?<segment>/?.*), /comments${segment}

        - id: like-service
          uri: ${LIKE_SERVICE_URL:lb://LIKE-SERVICE}
          predicates:
            - Path=/api/v1/likes/**, /likes/**
          filters:
            - RewritePath=/api/v1/likes(?<segment>/?.*), /likes${segment}

        - id: follow-service
          uri: ${FOLLOW_SERVICE_URL:lb://FOLLOW-SERVICE}
          predicates:
            - Path=/api/v1/follows/**, /follows/**
          filters:
            - RewritePath=/api/v1/follows(?<segment>/?.*), /follows${segment}

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:lb://NOTIFICATION-SERVICE}
          predicates:
            - Path=/api/v1/notifications/**, /notifications/**
          filters:
            - RewritePath=/api/v1/notifications(?<segment>/?.*), /notifications${segment}

        - id: notification-service-websocket
          uri: ${NOTIFICATION_SERVICE_WS_URL:lb:ws://NOTIFICATION-SERVICE}
          predicates:
            - Path=/ws-notifications, /ws-notifications/**

        - id: media-service-media
          uri: ${MEDIA_SERVICE_URL:lb://MEDIA-SERVICE}
          predicates:
            - Path=/api/v1/media/**, /media/**
          filters:
            - RewritePath=/api/v1/media(?<segment>/?.*), /media${segment}

        - id: media-service-stories
          uri: ${MEDIA_SERVICE_URL:lb://MEDIA-SERVICE}
          predicates:
            - Path=/api/v1/stories/**, /stories/**
          filters:
            - RewritePath=/api/v1/stories(?<segment>/?.*), /stories${segment}

        - id: search-service
          uri: ${SEARCH_SERVICE_URL:lb://SEARCH-SERVICE}
          predicates:
            - Path=/api/v1/search/**, /search/**
          filters:
            - RewritePath=/api/v1/search(?<segment>/?.*), /search${segment}

        - id: hashtag-service
          uri: ${SEARCH_SERVICE_URL:lb://SEARCH-SERVICE}
          predicates:
            - Path=/api/v1/hashtags/**, /hashtags/**
          filters:
            - RewritePath=/api/v1/hashtags(?<segment>/?.*), /hashtags${segment}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://service-registry:8761/eureka/}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
