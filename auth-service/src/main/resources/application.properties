# ============================================================
spring.application.name=auth-service

# ── Server ────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Database ──────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# ── JPA ───────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────────────────
app.jwt.secret=${APP_JWT_SECRET:ConnectSphereDefaultSecretKeyForDevelopmentOnlyNotForProduction2024}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}

# ── Redis ─────────────────────────────────────────────────
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
app.redis.session-ttl-seconds=86400

# ── Swagger / OpenAPI ─────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Actuator ──────────────────────────────────────────────
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.redis.enabled=false
management.health.db.enabled=false

# ── Logging ───────────────────────────────────────────────
logging.level.com.connectsphere=DEBUG

# ── Eureka ────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://service-registry:8761/eureka}
eureka.instance.prefer-ip-address=true
