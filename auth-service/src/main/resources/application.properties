2026-05-16T07:13:26.093518134Z ==> Common ways to troubleshoot your deploy: https://render.com/docs/troubleshooting-deploys

Your app is crashing because Railway/Render is not getting the database URL properly.

This line is the main issue:

Unable to determine Dialect without JDBC metadata

That means Spring Boot cannot connect to MySQL.

Do this exactly step-by-step:

STEP 1 — Open Railway MySQL Service
Go to your Railway project → MySQL service.

Open:

Variables

You will see things like:

MYSQL_URL

MYSQLHOST

MYSQLPORT

MYSQLUSER

MYSQLPASSWORD

MYSQLDATABASE

STEP 2 — Create Proper JDBC URL
You must NOT directly use MYSQL_URL sometimes.

Create this manually:

jdbc:mysql://MYSQLHOST:MYSQLPORT/MYSQLDATABASE?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
Example:

jdbc:mysql://roundhouse.proxy.rlwy.net:3306/railway?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
STEP 3 — Open Render Service
Go to your auth-service on Render.

Open:

Environment

Add these variables:

KEY	VALUE
DB_URL	your jdbc:mysql url
DB_USERNAME	MYSQLUSER value
DB_PASSWORD	MYSQLPASSWORD value
JWT_SECRET	ConnectSphereSecretKey2026ConnectSphereSecretKey2026
STEP 4 — ADD MYSQL DIALECT
Your application.properties is missing dialect.

Add this line:

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
So DB section becomes:

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
STEP 5 — Commit and Push
Run:

git add .
git commit -m "Fix MySQL config"
git push origin auth-service
STEP 6 — Redeploy Render
Go to Render:

Manual Deploy

Deploy latest commit

STEP 7 — Check Logs
If successful you will see:

Tomcat started on port
Started AuthServiceApplication
instead of Hibernate errors.


