services:
  - type: pserv
    name: service-registry
    runtime: docker
    plan: starter
    repo: https://github.com/MukulAIML/ConnctSphere.git
    branch: service-registry
    dockerfilePath: service-registry/Dockerfile
    dockerContext: service-registry
    envVars:
      - key: PORT
        value: "8761"
      - key: JAVA_TOOL_OPTIONS
        value: -Xms128m -Xmx384m

  - type: web
    name: api-gateway
    runtime: docker
    plan: starter
    repo: https://github.com/MukulAIML/ConnctSphere.git
    branch: api-gateway
    dockerfilePath: api-gateway/Dockerfile
    dockerContext: api-gateway
    envVars:
      - key: PORT
        value: "9000"
      - key: EUREKA_SERVER
        value: http://service-registry:8761/eureka/
      - key: JAVA_TOOL_OPTIONS
        value: -Xms128m -Xmx384m

  - type: pserv
    name: auth-service
    runtime: docker
    plan: starter
    repo: https://github.com/MukulAIML/ConnctSphere.git
    branch: auth-service
    dockerfilePath: auth-service/Dockerfile
    dockerContext: auth-service
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATA_REDIS_HOST
        value: redis
      - key: SPRING_DATA_REDIS_PORT
        value: "6379"
      - key: APP_JWT_SECRET
        sync: false
      - key: APP_JWT_EXPIRATION_MS
        value: "86400000"
      - key: APP_JWT_REFRESH_EXPIRATION_MS
        value: "604800000"
      - key: EUREKA_SERVER
        value: http://service-registry:8761/eureka/
      - key: JAVA_TOOL_OPTIONS
        value: -Xms128m -Xmx384m

  - type: pserv
    name: post-service
    runtime: docker
    plan: starter
    repo: https://github.com/MukulAIML/ConnctSphere.git
    branch: post-service
    dockerfilePath: post-service/Dockerfile
    dockerContext: post-service
    envVars:
      - key: PORT
        value: "8081"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: REDIS_HOST
        value: redis
      - key: REDIS_PORT
        value: "6379"
      - key: RABBITMQ_HOST
        value: rabbitmq
      - key: RABBITMQ_PORT
        value: "5672"
      - key: RABBITMQ_USERNAME
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SEARCH_SERVICE_URL
        value: http://search-service:8087
      - key: FOLLOW_SERVICE_URL
        value: http://follow-service:8084
      - key: MEDIA_SERVICE_URL
        value: http://media-service:8086
      - key: AUTH_SERVICE_URL
        value: http://auth-service:8080
      - key: COMMENT_SERVICE_URL
        value: http://comment-service:8082
      - key: NOTIFICATION_SERVICE_URL
        value: http://notification-service:8085
      - key: EUREKA_SERVER
        value: http://service-registry:8761/eureka/
      - key: JAVA_TOOL_OPTIONS
        value: -Xms128m -Xmx384m

  - type: pserv
    name: comment-service
