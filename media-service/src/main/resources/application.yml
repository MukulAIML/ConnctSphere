server:
  port: 8086

spring:
  application:
    name: media-service
  datasource:
    url: ${DB_URL:jdbc:mysql://connectsphere-db:3306/media_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:mukul}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  jwt:
    secret: ${JWT_SECRET:ConnectSphereSecretKey2026ConnectSphereSecretKey2026ConnectSphereSecretKey}

post-service:
  url: ${POST_SERVICE_URL:http://post-service:8081}

media:
  local:
    storage-path: ${MEDIA_LOCAL_STORAGE_PATH:/tmp/connectsphere-media}
  upload:
    max-image-kb: ${MEDIA_MAX_IMAGE_KB:10240}
    max-video-kb: ${MEDIA_MAX_VIDEO_KB:51200}

# AWS S3 Configuration
aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET:connectsphere-media}
    region: ${AWS_REGION:ap-south-1}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN:}   # e.g. d1abc123xyz.cloudfront.net (no trailing slash, no https://)

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http://service-registry:8761/eureka/}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
